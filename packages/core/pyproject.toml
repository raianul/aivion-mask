[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aivion-mask-core"
version = "0.2.0"
requires-python = ">=3.10"
description = "Shared masking engine for aivion-mask providers"
license = { text = "Apache-2.0" }
dependencies = [
    "aiosqlite>=0.20",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
