[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aivion-mask-claude"
version = "0.2.0"
requires-python = ">=3.10"
description = "Anthropic Claude provider for aivion-mask"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "aivion-mask-core>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "httpx>=0.27",
]

[project.scripts]
aivion-mask = "aivion_mask_claude.cli:main"
aivion-mask-claude = "aivion_mask_claude.main:run"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
